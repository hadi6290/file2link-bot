name = "file2link-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# پس از ساخت KV Namespace با دستور زیر:
#   npx wrangler kv namespace create LINKS
# مقدار id برگشتی را در خط پایین جایگزین کن.
[[kv_namespaces]]
binding = "LINKS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# متغیرهای محرمانه (BOT_TOKEN و WEBHOOK_SECRET) با دستور زیر ست می‌شوند
# و هرگز داخل این فایل نوشته نمی‌شوند:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
